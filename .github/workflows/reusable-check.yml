name: Liftosaur check

on:
  workflow_call:
    inputs:
      config:
        description: Repository-relative liftosaur-ci config path
        required: false
        default: liftosaur-ci.json
        type: string
      tool_repository:
        description: Repository containing liftosaur-ci
        required: false
        default: ivierlin/liftosaur-ci
        type: string
      tool_ref:
        description: Reviewed liftosaur-ci commit or tag
        required: true
        type: string
      runs_on:
        description: JSON array of runner labels
        required: false
        default: '["ubuntu-latest"]'
        type: string
    secrets:
      tool_token:
        description: Token able to read liftosaur-ci when it is private
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    steps:
      - name: Check out program repository
        uses: actions/checkout@v7
        with:
          path: repository
      - name: Check out liftosaur-ci
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          path: tool
          token: ${{ secrets.tool_token || github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up cached Liftosaur runtime
        working-directory: tool
        run: node scripts/setup-runtime.mjs
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
      - name: Check programs and reviewed snapshots
        shell: bash
        run: >-
          node "$GITHUB_WORKSPACE/tool/bin/liftosaur-ci.mjs" check
          --config "$GITHUB_WORKSPACE/repository/${{ inputs.config }}"
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
