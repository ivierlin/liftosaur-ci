name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liftosaur-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/setup-runtime.mjs
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
      - name: Run fast validation in parallel
        shell: bash
        run: |
          npm run test:unit > unit.log 2>&1 &
          unit_pid=$!
          npm run test:corpus:smoke > corpus.log 2>&1 &
          corpus_pid=$!

          if wait "$unit_pid"; then
            unit_status=0
          else
            unit_status=$?
          fi
          printf '\n=== unit tests ===\n'
          cat unit.log

          if wait "$corpus_pid"; then
            corpus_status=0
          else
            corpus_status=$?
          fi
          printf '\n=== built-in smoke corpus ===\n'
          cat corpus.log

          if (( unit_status != 0 || corpus_status != 0 )); then
            exit 1
          fi
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
          LIFTOSAUR_BUILTIN_SEED: ${{ github.sha }}

  full:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/setup-runtime.mjs
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
      - name: Run full validation in parallel
        shell: bash
        run: |
          npm run test:unit > unit.log 2>&1 &
          unit_pid=$!
          npm run test:corpus > corpus.log 2>&1 &
          corpus_pid=$!
          npm run test:history > history.log 2>&1 &
          history_pid=$!

          if wait "$unit_pid"; then
            unit_status=0
          else
            unit_status=$?
          fi
          printf '\n=== unit tests ===\n'
          cat unit.log

          if wait "$corpus_pid"; then
            corpus_status=0
          else
            corpus_status=$?
          fi
          printf '\n=== built-in corpus ===\n'
          cat corpus.log

          if wait "$history_pid"; then
            history_status=0
          else
            history_status=$?
          fi
          printf '\n=== historical updates ===\n'
          cat history.log

          if (( unit_status != 0 || corpus_status != 0 || history_status != 0 )); then
            exit 1
          fi
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
