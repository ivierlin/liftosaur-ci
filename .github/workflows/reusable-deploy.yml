name: Deploy Liftosaur program

on:
  workflow_call:
    inputs:
      deployment:
        description: Configured deployment ID
        required: false
        default: program
        type: string
      candidate_ref:
        description: Immutable reviewed commit; defaults to the caller commit
        required: false
        default: ''
        type: string
      base_ref:
        description: Required for the first deployment only
        required: false
        default: ''
        type: string
      config:
        description: Repository-relative liftosaur-ci config path
        required: false
        default: liftosaur-ci.json
        type: string
      environment:
        description: Optional GitHub Environment for approval hardening
        required: false
        default: ''
        type: string
      tool_repository:
        required: false
        default: ivierlin/liftosaur-ci
        type: string
      tool_ref:
        description: Reviewed liftosaur-ci commit or tag
        required: true
        type: string
      runs_on:
        required: false
        default: '["ubuntu-latest"]'
        type: string
    secrets:
      liftosaur_api_key:
        required: true
      tool_token:
        required: false

concurrency:
  group: liftosaur-deploy-${{ inputs.deployment }}
  cancel-in-progress: false

jobs:
  ready:
    name: Ready to deploy
    permissions:
      contents: read
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    outputs:
      required: ${{ steps.prepare.outputs.required }}
    steps:
      - name: Check out reviewed program repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: repository
          ref: ${{ inputs.candidate_ref || github.sha }}
      - name: Fetch deployment position
        working-directory: repository
        shell: bash
        run: git fetch origin '+refs/liftosaur-ci/deployments/*:refs/liftosaur-ci/deployments/*'
      - name: Check out liftosaur-ci
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          path: tool
          token: ${{ secrets.tool_token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set up Liftosaur validation
        working-directory: tool
        run: node scripts/setup-runtime.mjs
        env:
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
      - name: Prepare relevant program change
        id: prepare
        shell: bash
        run: |
          set -eu
          args=(prepare-git --repository "$GITHUB_WORKSPACE/repository" --config "$GITHUB_WORKSPACE/repository/$CONFIG" --deployment "$DEPLOYMENT" --candidate-ref "$CANDIDATE_REF" --output "$RUNNER_TEMP/liftosaur-deployment")
          if [ -n "$BASE_REF" ]; then args+=(--base-ref "$BASE_REF"); fi
          node "$GITHUB_WORKSPACE/tool/bin/liftosaur-ci.mjs" "${args[@]}"
          if [ -d "$RUNNER_TEMP/liftosaur-deployment" ]; then echo 'required=true' >> "$GITHUB_OUTPUT"; else echo 'required=false' >> "$GITHUB_OUTPUT"; fi
        env:
          BASE_REF: ${{ inputs.base_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
          CONFIG: ${{ inputs.config }}
          DEPLOYMENT: ${{ inputs.deployment }}
          LIFTOSAUR_API_KEY: ${{ secrets.liftosaur_api_key }}
          LIFTOSAUR_RUNTIME: ${{ runner.tool_cache }}/liftosaur-ci/runtime
      - name: Retain private prepared update
        if: steps.prepare.outputs.required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: liftosaur-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liftosaur-deployment
          retention-days: 1

  deploy:
    name: Deploy verified program
    needs: ready
    if: needs.ready.outputs.required == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    environment: ${{ inputs.environment || null }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: repository
          ref: ${{ inputs.candidate_ref || github.sha }}
      - name: Fetch deployment position
        working-directory: repository
        shell: bash
        run: git fetch origin '+refs/liftosaur-ci/deployments/*:refs/liftosaur-ci/deployments/*'
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.tool_repository }}
          ref: ${{ inputs.tool_ref }}
          path: tool
          token: ${{ secrets.tool_token || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: liftosaur-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liftosaur-deployment
      - name: Deploy and verify
        shell: bash
        run: node "$GITHUB_WORKSPACE/tool/bin/liftosaur-ci.mjs" deploy --bundle "$RUNNER_TEMP/liftosaur-deployment" --config "$GITHUB_WORKSPACE/repository/$CONFIG" --deployment "$DEPLOYMENT" --output "$RUNNER_TEMP/liftosaur-deployment-record"
        env:
          CONFIG: ${{ inputs.config }}
          DEPLOYMENT: ${{ inputs.deployment }}
          LIFTOSAUR_API_KEY: ${{ secrets.liftosaur_api_key }}
      - name: Record verified deployment position
        shell: bash
        run: node "$GITHUB_WORKSPACE/tool/bin/liftosaur-ci.mjs" record-deployment --repository "$GITHUB_WORKSPACE/repository" --config "$GITHUB_WORKSPACE/repository/$CONFIG" --deployment "$DEPLOYMENT" --report "$RUNNER_TEMP/liftosaur-deployment-record/deployment-report.json"
        env:
          CONFIG: ${{ inputs.config }}
          DEPLOYMENT: ${{ inputs.deployment }}
      - name: Open one-time target-binding pull request
        shell: bash
        run: |
          set -eu
          node -e 'const fs=require("fs"); const p=process.env.CONFIG_FILE; const c=JSON.parse(fs.readFileSync(p)); if(c.deployments[process.env.DEPLOYMENT].programId) process.exit(0); const r=JSON.parse(fs.readFileSync(process.env.REPORT)); c.deployments[process.env.DEPLOYMENT].programId=r.target.id; fs.writeFileSync(p, JSON.stringify(c,null,2)+"\n")'
          git -C repository diff --quiet && exit 0
          branch="liftosaur-ci/bind-$DEPLOYMENT-$GITHUB_RUN_ID"
          git -C repository config user.name github-actions[bot]
          git -C repository config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C repository switch -c "$branch"
          git -C repository add -- "$CONFIG"
          git -C repository commit -m "Pin $DEPLOYMENT Liftosaur target"
          git -C repository push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" --title "Pin $DEPLOYMENT Liftosaur target" --body "Pins the exact target resolved during the verified bootstrap deployment. Merge this before the next deployment."
        env:
          CONFIG: ${{ inputs.config }}
          CONFIG_FILE: ${{ github.workspace }}/repository/${{ inputs.config }}
          DEPLOYMENT: ${{ inputs.deployment }}
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/liftosaur-deployment-record/deployment-report.json
      - name: Retain private deployment receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: liftosaur-deployment-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/liftosaur-deployment-record
          if-no-files-found: warn
          retention-days: 1
